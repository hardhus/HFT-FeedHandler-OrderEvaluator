# Same flow as a fresh WSL / Raspberry Pi 5 checkout: ./scripts/bootstrap.sh && just ci
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      itch_real_rtl:
        description: "Also run real Nasdaq data through the RTL (just itch-real-rtl, about 90 min)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 (WSL-like) and arm64 (Raspberry Pi 5-like)
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pinned OSS CAD Suite + Verible (~2 GB unpacked); key changes only when tools.env does.
      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.env') }}

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', '.python-version') }}

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: just ci
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          just ci

      - name: Legacy lint report
        if: always()
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          just lint-legacy || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            build/test-results.xml
            build/lint/legacy.log
            build/sim/*/results.xml
          if-no-files-found: ignore

  # Real Nasdaq ITCH data (audit/12 S11): each run downloads the manifest's byte ranges straight
  # from Nasdaq into build/ and checks their SHA-256 (firmware/tb/data/itch_real.toml). The data is
  # never cached or uploaded (no redistribution); only the test results are.
  itch-real:
    name: itch-real (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.env') }}

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', '.python-version') }}

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: just itch-real
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          just itch-real

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itch-real-${{ matrix.os }}
          path: build/itch-real-results.xml
          if-no-files-found: ignore

  # The same data through itch_decoder (every message) and the system test (windows): manual runs
  # only (Actions > ci > Run workflow > itch_real_rtl), once per phase.
  itch-real-rtl:
    name: itch-real-rtl (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.itch_real_rtl
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.env') }}

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', '.python-version') }}

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: just itch-real-rtl
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          just itch-real-rtl

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itch-real-rtl-${{ matrix.os }}
          path: |
            build/itch-real-rtl-results.xml
            build/sim/*/run_*/results.xml
          if-no-files-found: ignore
