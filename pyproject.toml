[project]
name = "hft-feedhandler"
version = "0.0.0"
description = "FPGA ITCH feed handler / order evaluator: simulation and test environment"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "cocotb>=2,<3",
    "cocotbext-axi>=0.1.28",
    "pytest>=8",
    "pytest-xdist>=3",
    "scapy>=2.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["firmware/tb"]
pythonpath = ["firmware/tb"]
python_files = ["test_*.py"]
addopts = "-ra --junitxml=build/test-results.xml"
