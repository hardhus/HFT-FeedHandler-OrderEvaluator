# Real Nasdaq TotalView-ITCH 5.0 data (audit/12 S11): where to download it, not the data.
#
# The files are Nasdaq's public samples (https://emi.nasdaq.com/ITCH/). They carry no license
# that allows redistribution, so the data never enters this repository, its history, a CI
# cache or an artifact: firmware/tb/common/itch_real.py downloads the byte range below
# straight from Nasdaq into build/itch-real/ and checks its SHA-256. Every machine reads the
# same bytes and gets the same results.
#
# range: bytes of the compressed file (HTTP Range, inclusive); its start is the start of the
#   day's BinaryFile stream (2-byte length + message).
# status: active (downloaded and checked) or retired (the URL is gone; the entry stays with its
#   hash and results as the record, `note` says when and why, and is never downloaded).
# expect: what the model reads in the range (real/test_itch_real_model.py prints it for a new
#   source; checked on every run): messages, last timestamp (ns since midnight), Stock Directory
#   entries, MoldUDP64 packets of at most 1472 B, and messages per type.

[[source]]
name = "nasdaq-2019-12-30-128m"
url = "https://emi.nasdaq.com/ITCH/Nasdaq%20ITCH/12302019.NASDAQ_ITCH50.gz"
range = [0, 134217727]
sha256 = "b5a1febd13632b119ccc3f766297f3b36f6d78857873635906ade841da5a533c"
status = "active"

[source.expect]
msgs = 10403622
last_timestamp = 34350946648366  # 09:32:30.946648366
directory = 8906
packets = 245847
types = { A = 3907742, C = 2072, D = 3002773, E = 87571, F = 785665, H = 8901, I = 1073085, K = 3, L = 215089, P = 22773, Q = 8906, R = 8906, S = 3, U = 729719, V = 1, X = 541503, Y = 8910 }

